[package]
name = "bad-apple"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "3"
members = ["xtask", "."]
default-members = ["."]

[features]
default = []
high_res = []
qemu = ["uefi/qemu"]

# Taken from https://github.com/microsoft/edit/blob/a3a6f5f/Cargo.toml#L20-L31
# We use `opt-level = "s"` as it significantly reduces binary size.
# We could then use the `#[optimize(speed)]` attribute for spot optimizations.
# Unfortunately, that attribute currently doesn't work on intrinsics such as memset.
[profile.release]
codegen-units = 1           # Reduces binary size by ~2%
debug = "none"              # We probably don't need to debug in a release build
lto = true                  # Reduces binary size by ~14%
opt-level = "s"             # Reduces binary size by ~25%
split-debuginfo = "packed"  # Generates a separate *.dwp/*.dSYM so the binary can get stripped

[profile.dev]
codegen-units = 16          # We force enable AVX for rustc flags, LLVM parallelism would cause OOM 
incremental = false         # ^ Same reason as above ^

[dependencies]
uefi = "0.36.1"
thiserror = { version = "2.0.17", default-features = false }
zune-png = { version = "0.4.10", default-features = false }
resize = { version = "0.8.8", features = ["no_std"], default-features = false }
rgb = "0.8.50"
linked_list_allocator = "0.10.5"
fast_image_resize = { version = "5.6.0", features = ["no_std"], default-features = false }
libm = "0.2.15"
spin = { version = "0.10.0", features = ["lazy"], default-features = false }
