[build]
target = "x86_64-unknown-uefi"

rustflags = [
    "-C",
    "target-feature=+sse,+sse2,+sse4.1,+avx,+avx2,-soft-float",

    # Makes out hot loops call our own optimized copies of generics instead of the slow unoptimized
    # copies built from our dependencies. This way, we can save build time buy only compiling our own
    # crate at an opt-level of 1, while compiling dependencies without any optimizations in debug mode
    "-Zshare-generics=no",
]

[alias]
xtask = "run --quiet --release --target x86_64-unknown-linux-gnu --manifest-path ./xtask/Cargo.toml --"
